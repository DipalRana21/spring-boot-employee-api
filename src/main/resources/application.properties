spring.application.name=employee-api
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/employee_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Local development only: replace with a securely generated secret.
# app.jwt.secret=MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=


# Select the environment; default to development
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JWT signing secret, supplied externally
app.jwt.secret=${JWT_SECRET}